server:
  port: 8090

spring:
  application:
    name: short-link

  # ---------- MySQL ----------
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/short_link?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
    username: root
    password: root

  # ---------- Redis ----------
  redis:
    host: localhost
    port: 6379
    # password:            # 本地 Redis 默认无密码，不用填
    database: 0            # 用 0 号库
    timeout: 5000ms        # 连接超时
    lettuce:
      pool:
        max-active: 8      # 最大连接数
        max-idle: 8        # 最大空闲连接
        min-idle: 0        # 最小空闲连接
        max-wait: -1ms     # 获取连接最大等待时间，-1 表示不限

# ---------- MyBatis-Plus ----------
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 控制台打印 SQL（调试用）
    map-underscore-to-camel-case: true                     # short_code -> shortCode
  global-config:
    db-config:
      update-strategy: not_empty   # 只更新非空字段

logging:
  level:
    com.xs: debug